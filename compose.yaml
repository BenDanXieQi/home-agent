name: home-agent
services:
  go2rtc:
    image: home-agent/go2rtc:1.9.14
    build:
      context: ./docker/go2rtc
    restart: unless-stopped
    network_mode: host
    command:
      - go2rtc
      - -config
      - /config/go2rtc.yaml
      - -config
      - '{"api":{"listen":"127.0.0.1:1984"},"rtsp":{"listen":"127.0.0.1:8554"},"webrtc":{"listen":"127.0.0.1:8555","candidates":["127.0.0.1:8555"],"filters":{"loopback":true}}}'
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1984/api"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - type: bind
        source: ./config/go2rtc
        target: /config
        bind:
          create_host_path: false
  db:
    image: timescale/timescaledb:2.30.1-pg18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: home_agent
      POSTGRES_USER: home_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_agent -d home_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
