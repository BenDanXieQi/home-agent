name: home-agent
services:
  db:
    image: timescale/timescaledb:2.30.1-pg18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: home_agent
      POSTGRES_USER: home_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_agent -d home_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
