name: home-agent
include:
  - docker/langfuse/compose.yaml
services:
  agent-mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:?Set MYSQL_PORT in the root .env}:3306"
    environment:
      MYSQL_DATABASE: home_agent
      MYSQL_USER: home_agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env}
    volumes:
      - agent-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u home_agent -D home_agent -e "SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  go2rtc:
    image: home-agent/go2rtc:1.9.14
    build:
      context: ./docker/go2rtc
    restart: unless-stopped
    network_mode: host
    command:
      - go2rtc
      - -config
      - /config/go2rtc.yaml
      - -config
      - '{"api":{"listen":"127.0.0.1:1984"},"rtsp":{"listen":"127.0.0.1:8554"},"webrtc":{"listen":"127.0.0.1:8555","candidates":["127.0.0.1:8555"],"filters":{"loopback":true}}}'
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1984/api"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - type: bind
        source: ./config/go2rtc
        target: /config
        bind:
          create_host_path: false
  db:
    image: timescale/timescaledb:2.30.1-pg18
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in the root .env}:5432"
    environment:
      POSTGRES_DB: home_agent
      POSTGRES_USER: home_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_agent -d home_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  agent-mysql-data:
